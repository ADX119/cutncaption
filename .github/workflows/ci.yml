name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code; it cannot push, comment or change anything.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit tests, build
        run: pnpm check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Reuses the build from `pnpm check`; WebKit and the device projects run locally.
      - name: End-to-end tests (Chromium)
        run: pnpm exec playwright test --project=chromium --grep-invert @slow

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
